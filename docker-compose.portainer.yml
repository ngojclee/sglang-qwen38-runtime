version: "3.8"

networks:
  vast-net:
    driver: bridge

services:
  # ===== 1. DYNAMIC TUNNEL MANAGER (TỰ ĐỌC FILE INSTANCES.TXT & MỞ CỔNG TỨC THÌ) =====
  vast-tunnel:
    image: alpine:latest
    restart: unless-stopped
    container_name: vast-tunnel
    networks:
      - vast-net
    volumes:
      - /home/Docker/vast-tunnel/ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - /home/Docker/vast-tunnel/ssh/known_hosts:/root/.ssh/known_hosts:rw
      - /home/Docker/vast-tunnel/instances.txt:/etc/vast/instances.txt:rw
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache openssh-client sed grep procps
        mkdir -p /etc/vast
        touch /etc/vast/instances.txt

        echo "🚀 Dynamic Tunnel Manager started. Watching /etc/vast/instances.txt..."
        
        while true; do
          PORT_INDEX=18001
          while read -r line || [ -n "$$line" ]; do
            case "$$line" in \#*|"") continue ;; esac
            
            HOST=$$(echo "$$line" | awk '{print $$1}')
            PORT=$$(echo "$$line" | awk '{print $$2}')
            
            if [ -n "$$HOST" ] && [ -n "$$PORT" ]; then
              if ! pgrep -f "0.0.0.0:$$PORT_INDEX:127.0.0.1:18000" > /dev/null 2>&1; then
                echo "🔗 Spawning background tunnel on port $$PORT_INDEX to $$HOST:$$PORT..."
                (while true; do
                  ssh -q -N -g -L 0.0.0.0:$$PORT_INDEX:127.0.0.1:18000 \
                      -o GatewayPorts=yes \
                      -o ServerAliveInterval=15 \
                      -o ServerAliveCountMax=3 \
                      -o ExitOnForwardFailure=yes \
                      -o StrictHostKeyChecking=accept-new \
                      -o UserKnownHostsFile=/root/.ssh/known_hosts \
                      -i /root/.ssh/id_ed25519 \
                      -p $$PORT root@$$HOST 2>/dev/null || sleep 5
                  sleep 5
                done) &
              fi
              PORT_INDEX=$$((PORT_INDEX + 1))
            fi
          done < /etc/vast/instances.txt
          sleep 10
        done

  # ===== 2. VAST GATEWAY (DYNAMIC SINGLE-ACTIVE LEADER ROUTER & AUTO-SCALER) =====
  vast-gateway:
    image: python:3.11-alpine
    container_name: vast-gateway
    restart: unless-stopped
    networks:
      - vast-net
    ports:
      - "18000:18000"
    environment:
      - VAST_API_KEY=${VAST_API_KEY}
      - API_LLM_SERVER=${API_LLM_SERVER}
      - VAST_PROVIDER_NAME=${VAST_PROVIDER_NAME}
      - IDLE_TIMEOUT_MINUTES=${IDLE_TIMEOUT_MINUTES:-30}
      - AUTO_SCALE_ENABLED=${AUTO_SCALE_ENABLED:-true}
      - LANGUAGE_PROMPT=${LANGUAGE_PROMPT:-Always communicate and explain in Vietnamese (Tiếng Việt). Keep code syntax, terminal commands, variable names, and programming technical terms in English.}
    volumes:
      - /home/Docker/CLIProxyAPI/config.yaml:/cpa-config.yaml:rw
      - /home/Docker/vast-tunnel/instances.txt:/etc/vast/instances.txt:rw
    entrypoint:
      - /bin/sh
      - -c
      - |
        pip install --no-cache-dir fastapi uvicorn httpx
        cat << 'EOF' > /app.py
        import asyncio, os, time, re, json, httpx
        from fastapi import FastAPI, Request
        from fastapi.responses import Response, StreamingResponse

        app = FastAPI()
        VAST_API_KEY = os.getenv("VAST_API_KEY", "")
        API_LLM_SERVER = os.getenv("API_LLM_SERVER", "")
        PROVIDER_NAME = os.getenv("VAST_PROVIDER_NAME", "ln.vastai")
        IDLE_TIMEOUT_MINUTES = int(os.getenv("IDLE_TIMEOUT_MINUTES", "30"))
        AUTO_SCALE_ENABLED = os.getenv("AUTO_SCALE_ENABLED", "true").lower() == "true"
        LANGUAGE_PROMPT = os.getenv("LANGUAGE_PROMPT", "")
        
        last_activity = time.time()
        active_requests = 0
        current_active_node = None
        lock = asyncio.Lock()

        # 1. Tự động đồng bộ CPA config
        def sync_cpa_config():
            conf_path = "/cpa-config.yaml"
            if not os.path.exists(conf_path) or not API_LLM_SERVER:
                return
            try:
                with open(conf_path, "r", encoding="utf-8") as f:
                    content = f.read()
                pattern = rf'(- name:\s*{re.escape(PROVIDER_NAME)}[\s\S]*?base-url:\s*)[^\n]+([\s\S]*?- api-key:\s*)[^\n]+'
                replacement = rf'\g<1>http://vast-gateway:18000/v1\g<2>{API_LLM_SERVER}'
                if re.search(rf'- name:\s*{re.escape(PROVIDER_NAME)}', content):
                    new_content = re.sub(pattern, replacement, content, count=1)
                    if new_content != content:
                        with open(conf_path, "w", encoding="utf-8") as f:
                            f.write(new_content)
                        print(f"🎉 Auto-synced CPA config for provider '{PROVIDER_NAME}'!", flush=True)
            except Exception as e:
                print(f"⚠️ Error syncing CPA config: {e}", flush=True)

        sync_cpa_config()

        # 2. Tự động quét Vast API để phát hiện mọi máy mới tạo, lấy giá dph và tự ghi vào instances.txt
        async def auto_sync_instances_from_vast():
            if not VAST_API_KEY:
                return
            inst_path = "/etc/vast/instances.txt"
            url = f"https://console.vast.ai/api/v1/instances/?api_key={VAST_API_KEY}"
            try:
                async with httpx.AsyncClient(timeout=15.0) as client:
                    resp = await client.get(url)
                    if resp.status_code == 200:
                        data = resp.json()
                        instances = data.get("instances", []) if isinstance(data, dict) else (data if isinstance(data, list) else [])
                        
                        def get_price(inst):
                            p = inst.get("dph_total") or inst.get("dph_base") or inst.get("search", {}).get("dph")
                            try:
                                return float(p) if p is not None else 999.0
                            except:
                                return 999.0
                        
                        # Sắp xếp máy theo giá tăng dần (máy rẻ nhất đứng đầu)
                        instances.sort(key=get_price)

                        new_lines = []
                        for inst in instances:
                            inst_id = inst.get("id")
                            ssh_host = inst.get("ssh_host")
                            ssh_port = inst.get("ssh_port")
                            # Ưu tiên Direct IP + port 22 (proxy Vast đôi khi "Connection closed" khi nhiều tunnel)
                            public_ip = inst.get("public_ipaddr")
                            direct_port = None
                            p22 = (inst.get("ports") or {}).get("22/tcp") if isinstance(inst.get("ports"), dict) else None
                            if isinstance(p22, list) and p22 and isinstance(p22[0], dict):
                                direct_port = p22[0].get("HostPort")
                            if public_ip and direct_port:
                                ssh_host, ssh_port = public_ip, direct_port
                            price = get_price(inst)
                            if inst_id and ssh_host and ssh_port:
                                if price < 900:
                                    new_lines.append(f"{ssh_host} {ssh_port} {inst_id} {price:.3f}")
                                else:
                                    new_lines.append(f"{ssh_host} {ssh_port} {inst_id}")
                        
                        if new_lines:
                            new_content = "\n".join(new_lines) + "\n"
                            old_content = ""
                            if os.path.exists(inst_path):
                                with open(inst_path, "r", encoding="utf-8") as f:
                                    old_content = f.read()
                            
                            if new_content.strip() != old_content.strip():
                                os.makedirs(os.path.dirname(inst_path), exist_ok=True)
                                with open(inst_path, "w", encoding="utf-8") as f:
                                    f.write(new_content)
                                print(f"🔄 Auto-synced and cost-sorted {len(new_lines)} instances from Vast API into {inst_path}!", flush=True)
            except Exception as e:
                print(f"⚠️ Error querying Vast API instances: {e}", flush=True)

        # 3. Đọc danh sách máy từ instances.txt và sắp xếp theo ưu tiên giá rẻ nhất
        def get_cluster_nodes():
            nodes = []
            inst_path = "/etc/vast/instances.txt"
            if os.path.exists(inst_path):
                with open(inst_path, "r", encoding="utf-8") as f:
                    lines = [l.strip() for l in f.readlines() if l.strip() and not l.startswith("#")]
                    for idx, line in enumerate(lines):
                        parts = line.split()
                        if len(parts) >= 2:
                            host = parts[0]
                            port = parts[1]
                            inst_id = str(parts[2]) if len(parts) >= 3 else None
                            try:
                                price = float(parts[3]) if len(parts) >= 4 else 999.0
                            except:
                                price = 999.0
                            nodes.append({
                                "target": f"vast-tunnel:{18001 + idx}",
                                "instance_id": inst_id,
                                "host": host,
                                "port": port,
                                "price": price,
                                "index": idx
                            })
            # Sắp xếp danh sách máy theo giá tăng dần
            nodes.sort(key=lambda x: x["price"])
            return nodes if nodes else [{"target": "vast-tunnel:18001", "instance_id": None, "price": 999.0, "index": 0}]

        async def is_node_healthy(target):
            try:
                # 1. Thử endpoint /health nhẹ và không bị lock GIL khi prefill lớn
                async with httpx.AsyncClient(timeout=4.0) as c:
                    r = await c.get(f"http://{target}/health")
                    if r.status_code == 200:
                        return True
                    # 2. Fallback /v1/models
                    headers = {"Authorization": f"Bearer {API_LLM_SERVER}"} if API_LLM_SERVER else {}
                    r2 = await c.get(f"http://{target}/v1/models", headers=headers)
                    return r2.status_code in (200, 401)
            except:
                return False

        async def set_instance_state(inst_id, state):
            if not VAST_API_KEY or not inst_id: return False
            url = f"https://console.vast.ai/api/v0/instances/{inst_id}/?api_key={VAST_API_KEY}"
            try:
                async with httpx.AsyncClient(timeout=10.0) as c:
                    r = await c.put(url, json={"state": state})
                    return r.status_code == 200
            except:
                return False

        # 4. Dynamic Cost-Aware Leader Resolution (Ưu tiên cố định máy rẻ nhất, chống nhảy qua lại)
        async def resolve_active_node():
            global current_active_node, last_activity
            last_activity = time.time()
            nodes = get_cluster_nodes()

            async with lock:
                # Ưu tiên số 1: Kiểm tra máy rẻ nhất (nodes[0])
                primary = nodes[0] if nodes else None
                if primary and await is_node_healthy(primary["target"]):
                    if not current_active_node or current_active_node["target"] != primary["target"]:
                        print(f"🎯 Cost-Priority Leader locked: {primary['target']} (Instance {primary['instance_id']} - USD {primary['price']}/hr)", flush=True)
                        current_active_node = primary
                    return current_active_node

                # Nếu máy rẻ nhất tạm thời chưa sẵn sàng -> Thử các máy dự phòng tiếp theo
                for fallback_node in nodes[1:]:
                    if await is_node_healthy(fallback_node["target"]):
                        if not current_active_node or current_active_node["target"] != fallback_node["target"]:
                            print(f"⚠️ Primary node busy/offline. Fallback active: {fallback_node['target']} (Instance {fallback_node['instance_id']} - USD {fallback_node['price']}/hr)", flush=True)
                            current_active_node = fallback_node
                        return current_active_node

                # Tất cả đều tắt -> Khởi động máy có giá rẻ nhất (nodes[0])
                if primary and primary["instance_id"] and AUTO_SCALE_ENABLED:
                    print(f"🚀 Cold-starting cheapest instance {primary['instance_id']} (USD {primary['price']}/hr)...", flush=True)
                    await set_instance_state(primary["instance_id"], "running")
                    
                    start_t = time.time()
                    while time.time() - start_t < 90:
                        await asyncio.sleep(3)
                        if await is_node_healthy(primary["target"]):
                            print(f"🎉 Instance {primary['instance_id']} is now LIVE & ACTIVE!", flush=True)
                            current_active_node = primary
                            return current_active_node
                
                return current_active_node or (nodes[0] if nodes else None)

        # 5. Quản lý dọn dẹp các máy thừa trên Vast.ai & tự tắt khi IDLE
        @app.on_event("startup")
        async def start_auto_scaler():
            async def scaler_loop():
                global current_active_node
                while True:
                    await asyncio.sleep(60)
                    if not VAST_API_KEY:
                        continue
                    
                    # Khi AUTO_SCALE_ENABLED=false: TẠM NGƯNG auto-scale.
                    # Chỉ đồng bộ instances.txt để tunnel nhìn thấy máy, KHÔNG start/stop máy.
                    if not AUTO_SCALE_ENABLED:
                        print("🛑 AUTO_SCALE_ENABLED=false — auto start/stop TẠM NGƯNG (chỉ sync instances.txt)", flush=True)
                        await auto_sync_instances_from_vast()
                        continue

                    if active_requests > 0:
                        continue
                    
                    idle_seconds = time.time() - last_activity
                    nodes = get_cluster_nodes()

                    # A. Tắt toàn bộ máy nếu không có ai dùng quá IDLE_TIMEOUT_MINUTES
                    if idle_seconds > (IDLE_TIMEOUT_MINUTES * 60):
                        for node in nodes:
                            if node["instance_id"]:
                                try:
                                    await set_instance_state(node["instance_id"], "stopped")
                                    print(f"💤 All idle > {IDLE_TIMEOUT_MINUTES}m. Stopped instance {node['instance_id']}", flush=True)
                                except Exception as e:
                                    print(f"Error stopping instance: {e}", flush=True)
                        current_active_node = None

                    # B. Chưa quá timeout: Quét trực tiếp trên Vast API và TẮT ngay các máy thừa trong CHÙM NÀY (không đụng máy khác của user)
                    else:
                        primary_leader = current_active_node or (nodes[0] if nodes else None)
                        leader_id = str(primary_leader.get("instance_id")) if primary_leader else None
                        
                        # Chỉ quản lý các instance ID nằm trong cấu hình cụm này!
                        cluster_instance_ids = {str(n.get("instance_id")) for n in nodes if n.get("instance_id")}
                        
                        url = f"https://console.vast.ai/api/v1/instances/?api_key={VAST_API_KEY}"
                        try:
                            async with httpx.AsyncClient(timeout=10.0) as client:
                                resp = await client.get(url)
                                if resp.status_code == 200:
                                    data = resp.json()
                                    api_insts = data.get("instances", []) if isinstance(data, dict) else (data if isinstance(data, list) else [])
                                    for inst in api_insts:
                                        inst_id = str(inst.get("id"))
                                        actual_status = inst.get("actual_status") or inst.get("intended_status")
                                        
                                        # Chỉ can thiệp nếu instance ID này thuộc chùm của ta VÀ đang chạy VÀ không phải Leader
                                        if inst_id in cluster_instance_ids and actual_status == "running" and leader_id and inst_id != leader_id:
                                            print(f"💰 Auto-stopping redundant cluster machine {inst_id} on Vast.ai (keeping active leader {leader_id})...", flush=True)
                                            await set_instance_state(inst_id, "stopped")
                        except Exception as e:
                            print(f"⚠️ Error checking redundant instances on Vast: {e}", flush=True)
            asyncio.create_task(scaler_loop())

        # 6. Direct Real-Time Streaming & Fast Reverse Proxy
        @app.api_route("/{path:path}", methods=["GET", "POST", "PUT", "DELETE", "OPTIONS", "HEAD"])
        async def proxy(req: Request, path: str):
            global last_activity, active_requests
            last_activity = time.time()
            active_requests += 1
            
            try:
                node = await resolve_active_node()
                target_url = f"http://{node['target']}/{path}"
                if req.url.query: target_url += f"?{req.url.query}"
                
                body = await req.body()
                headers = {k: v for k, v in req.headers.items() if k.lower() not in ("host", "content-length", "connection", "accept-encoding")}
                
                is_stream = False
                try:
                    if req.method == "POST" and body:
                        payload = json.loads(body.decode("utf-8"))
                        is_stream = bool(payload.get("stream", False))
                        messages = payload.get("messages", [])
                        if messages and LANGUAGE_PROMPT:
                            if messages[0].get("role") == "system":
                                if LANGUAGE_PROMPT not in messages[0].get("content", ""):
                                    messages[0]["content"] += f"\n\n{LANGUAGE_PROMPT}"
                            else:
                                messages.insert(0, {"role": "system", "content": LANGUAGE_PROMPT})
                            body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                except:
                    pass

                client = httpx.AsyncClient(timeout=600.0)

                if is_stream:
                    req_stream = client.build_request(method=req.method, url=target_url, headers=headers, content=body)
                    upstream_resp = await client.send(req_stream, stream=True)

                    async def sse_generator():
                        pending_whitespace_chunks = []
                        try:
                            async for line in upstream_resp.aiter_lines():
                                if not line: continue
                                if line == "data: [DONE]":
                                    # Xả nốt whitespace cuối luồng nếu có
                                    for pending in pending_whitespace_chunks:
                                        yield (f"data: {json.dumps(pending, ensure_ascii=False)}\n\n").encode("utf-8")
                                    pending_whitespace_chunks.clear()
                                    yield b"data: [DONE]\n\n"
                                    continue
                                    
                                if line.startswith("data: "):
                                    try:
                                        data = json.loads(line[6:])
                                        choices = data.get("choices", [])
                                        if choices:
                                            delta = choices[0].get("delta", {})
                                            content = delta.get("content")
                                            tool_calls = delta.get("tool_calls")
                                            finish_reason = choices[0].get("finish_reason")
                                            
                                            # A. Nếu chunk có Tool Call hoặc kết thúc bằng tool_calls:
                                            # HỦY BỎ toàn bộ whitespace đệm phía trước! (Triệt tiêu \n\n edge-case)
                                            if tool_calls or finish_reason == "tool_calls":
                                                pending_whitespace_chunks.clear()
                                                if isinstance(content, str) and content.strip() == "":
                                                    del delta["content"]
                                                yield (f"data: {json.dumps(data, ensure_ascii=False)}\n\n").encode("utf-8")
                                                continue
                                            
                                            # B. Nếu chunk là whitespace đơn thuần:
                                            # ĐƯA VÀO BUFFER để chờ xem chunk tiếp theo là text hay tool call!
                                            if isinstance(content, str) and content.strip() == "":
                                                if not delta.get("role") and not delta.get("reasoning_content"):
                                                    pending_whitespace_chunks.append(data)
                                                    continue # Tạm giữ lại, chưa phát ra
                                                else:
                                                    del delta["content"]
                                                    yield (f"data: {json.dumps(data, ensure_ascii=False)}\n\n").encode("utf-8")
                                                    continue
                                            
                                            # C. Nếu chunk là văn bản có nghĩa (Text):
                                            # XẢ HẾT whitespace đệm trước đó rồi mới phát chunk này -> Bảo toàn 100% thụt lề code
                                            if isinstance(content, str) and content.strip() != "":
                                                for pending in pending_whitespace_chunks:
                                                    yield (f"data: {json.dumps(pending, ensure_ascii=False)}\n\n").encode("utf-8")
                                                pending_whitespace_chunks.clear()
                                                yield (f"data: {json.dumps(data, ensure_ascii=False)}\n\n").encode("utf-8")
                                                continue
                                                
                                            # D. Các chunk khác (như reasoning_content)
                                            yield (f"data: {json.dumps(data, ensure_ascii=False)}\n\n").encode("utf-8")
                                            continue
                                    except:
                                        pass
                                yield (line + "\n\n").encode("utf-8")
                        finally:
                            await upstream_resp.aclose()
                            await client.aclose()

                    return StreamingResponse(
                        sse_generator(),
                        status_code=upstream_resp.status_code,
                        media_type="text/event-stream",
                        headers={
                            "Cache-Control": "no-cache",
                            "Connection": "keep-alive",
                            "X-Accel-Buffering": "no"
                        }
                    )
                else:
                    try:
                        resp = await client.request(method=req.method, url=target_url, headers=headers, content=body)
                        resp_headers = {k: v for k, v in resp.headers.items() if k.lower() not in ("content-length", "transfer-encoding")}
                        return Response(content=resp.content, status_code=resp.status_code, headers=resp_headers, media_type=resp.headers.get("content-type"))
                    finally:
                        await client.aclose()

            except Exception as e:
                return Response(content=f'{{"error": "Failed communicating with active instance: {e}"}}'.encode(), status_code=503)
            finally:
                active_requests = max(0, active_requests - 1)
        EOF
        python -m uvicorn app:app --host 0.0.0.0 --port 18000

  # ===== 3. CLIPROXYAPI (CPA) =====
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    pull_policy: always
    container_name: cli-proxy-api
    restart: unless-stopped
    init: true
    networks:
      - vast-net
    depends_on:
      - vast-gateway
    ports:
      - "8317:8317"
      - "127.0.0.1:1455:1455"
    environment:
      TZ: ${TZ:-Europe/Paris}
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD}
      OPENCODEX_DEVICE_ID_PATH: ${OPENCODEX_DEVICE_ID_PATH:-/data/opencodex/device-id}
      CPA_PLUGIN_GITHUB_TOKEN: "${CPA_PLUGIN_GITHUB_TOKEN}"
      CPA_CODEX_COMPACTION_KEY: "${CPA_CODEX_COMPACTION_KEY}"
    volumes:
      - /home/Docker/CLIProxyAPI/config.yaml:/CLIProxyAPI/config.yaml:rw
      - /home/Docker/CLIProxyAPI/.cli-proxy-api:/root/.cli-proxy-api:rw
      - /home/Docker/CLIProxyAPI/plugins:/CLIProxyAPI/plugins:rw
      - /home/Docker/CLIProxyAPI/logs:/CLIProxyAPI/logs:rw
      - /home/Docker/CLIProxyAPI/opencodex:/data/opencodex:rw
