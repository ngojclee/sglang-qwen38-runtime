# ============================================================
# PROFILE CHUẨN: Qwen3.8-27B DFlash2 — CỤM 2x RTX 3090 24GB (TP=2)
# ============================================================
# Đây là profile "Golden Runtime" cho máy 2x RTX 3090 24GB (48GB VRAM),
# đúng theo máy D đã test ngon lành (benchmark 2026-08-22/23):
#   - KV Pool VRAM: ~201,700 tokens (mem 0.90 + hicache 4.0)
#   - Tốc độ: 4K 27-29 tok/s | 32K 26-27 | 100K 23-25 | 200K/262K cần headroom
# Bootstrap tự detect 24GB+ GPU và tạo đúng bộ cờ này khi mở máy mới.
# File này để tham chiếu / deploy tay khi cần.
#
# Lưu ý: 16GB GPU (5060 Ti) dùng mem 0.86 / draft 6 / hicache 3.0 — KHÁC bộ này.
# ============================================================

--model-path /root/models/hotdogs-Qwen3.8-27B-AWQ-INT4
--tensor-parallel-size 2
--speculative-algorithm DFLASH
--speculative-draft-model-path /root/models/Qwen3.8-27B-DFlash2
--speculative-num-draft-tokens 8
--speculative-draft-model-quantization unquant
--kv-cache-dtype fp8_e4m3
--quantization compressed-tensors
--trust-remote-code
--served-model-name Qwen3.8-27B-Uncensored
--reasoning-parser qwen3
--tool-call-parser qwen3_coder
--enable-strict-thinking
--mem-fraction-static 0.90
--context-length 262144
--allow-auto-truncate
--enable-cache-report
--chunked-prefill-size 2048
--max-prefill-tokens 16384
--disable-custom-all-reduce
--max-running-requests 4
--linear-attn-backend triton
--enable-hierarchical-cache
--hicache-ratio 4.0
--hicache-write-policy write_through
--hicache-io-backend kernel
--hicache-mem-layout page_first
--host 127.0.0.1
--port 18000
