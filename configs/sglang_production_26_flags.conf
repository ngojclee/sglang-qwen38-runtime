# ========================================================
# Full 26 Production Flags Reference Profile
# All 6 Groups: HiCache, Mamba/GDN, Context, Quant, PCIe, Reasoning
# ========================================================

# [Group 4: Quantization & Model Architecture]
--model-path /root/models/hotdogs-Qwen3.8-27B-AWQ-INT4
--quantization compressed-tensors
--tensor-parallel-size 2
--trust-remote-code
--served-model-name Qwen3.8-27B-Uncensored

# [Group 6: Reasoning & Function Calling]
--reasoning-parser qwen3
--tool-call-parser qwen3_coder
--enable-strict-thinking

# [Group 3: VRAM, Memory & Context Length]
--mem-fraction-static 0.90
--context-length 262144
--allow-auto-truncate
--enable-cache-report
--chunked-prefill-size 2048
--max-prefill-tokens 16384


# [Group 5: Multi-GPU & PCIe Interconnect]
--disable-custom-all-reduce
--max-running-requests 4
--host 127.0.0.1
--port 18000

# [Group 2: Mamba & Linear Attention Kernels]
--linear-attn-backend triton

# [Group 1: HiCache Host RAM Offload]
--enable-hierarchical-cache
--hicache-ratio 2.0
--hicache-write-policy write_through
--hicache-io-backend kernel
--hicache-mem-layout page_first

# [Speculative Decoding with DFlash2]
--speculative-algorithm DFLASH
--speculative-draft-model-path /root/models/Qwen3.8-27B-DFlash2
--speculative-num-draft-tokens 8
--speculative-draft-model-quantization unquant
