# ============================================================
# PROFILE CHUẨN: Qwen3.8-27B DFlash2 — CỤM 2x RTX 5060 Ti 16GB (TP=2)
# ============================================================
# Mục tiêu: ưu tiên ≥200K context + tốc độ tốt (bootstrap tự detect 16GB)
#   - mem-fraction 0.90 / DFlash2 draft 6 / HiCache 3.0 / 262K context
#   - max-running-requests 2 (16GB card, nhẹ hơn)
#   - KV cache FP8 E4M3, Linear attention Triton, chunked-prefill 2048
# ============================================================

--model-path /root/models/hotdogs-Qwen3.8-27B-AWQ-INT4
--tensor-parallel-size 2
--speculative-algorithm DFLASH
--speculative-draft-model-path /root/models/Qwen3.8-27B-DFlash2
--speculative-num-draft-tokens 6
--speculative-draft-model-quantization unquant
--kv-cache-dtype fp8_e4m3
--quantization compressed-tensors
--trust-remote-code
--served-model-name Qwen3.8-27B-Uncensored
--reasoning-parser qwen3
--tool-call-parser qwen3_coder
--enable-strict-thinking
--mem-fraction-static 0.90
--context-length 262144
--allow-auto-truncate
--enable-cache-report
--chunked-prefill-size 2048
--max-prefill-tokens 16384
--disable-custom-all-reduce
--max-running-requests 2
--linear-attn-backend triton
--enable-hierarchical-cache
--hicache-ratio 3.0
--hicache-write-policy write_through
--hicache-io-backend kernel
--hicache-mem-layout page_first
--host 127.0.0.1
--port 18000
